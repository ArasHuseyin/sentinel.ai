name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 03:17 UTC daily — off the hour, where runner contention is lower.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Let every combination report; a Windows-only path bug should not be
      # hidden behind a cancelled Linux job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
        # Windows runners are slow and the OS-specific risk is path handling,
        # not the Node version — one Windows job is enough to catch it.
        exclude:
          - os: windows-latest
            node-version: 22.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Packs the tarball, installs it into a scratch project and imports it the
      # way a consumer does. 4.1.6 shipped unimportable because `files` in
      # package.json omitted dist/exports.js — tsc and the unit tests were both
      # green. Only resolving the real tarball catches that class of bug.
      - name: Verify published package is importable
        run: npm run verify:package

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (real browser)
    # Drives live third-party sites and burns real LLM tokens, so it cannot gate
    # every push. Nightly plus manual dispatch keeps it honest without making
    # a third party's downtime look like our regression.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:e2e
